<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>wordle-br</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 14px;
    font: 16px/1.4 ui-sans-serif, system-ui, sans-serif; background: #0b0f17; color: #e5e7eb; padding: 16px; user-select: none; }
  h1 { margin: 6px 0 0; font-size: 22px; letter-spacing: 2px; }
  #board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .tile { width: 54px; height: 54px; display: grid; place-items: center; font-size: 26px; font-weight: 800; text-transform: uppercase;
    border: 2px solid #374151; border-radius: 6px; transition: background .2s, border-color .2s; }
  .tile.filled { border-color: #6b7280; }
  .tile.correct { background: #22c55e; border-color: #22c55e; color: #05140a; }
  .tile.present { background: #eab308; border-color: #eab308; color: #1a1400; }
  .tile.absent { background: #1f2937; border-color: #1f2937; color: #6b7280; }
  #msg { min-height: 22px; font-weight: 700; }
  #kb { display: flex; flex-direction: column; gap: 6px; align-items: center; margin-top: 6px; }
  .krow { display: flex; gap: 5px; }
  .key { min-width: 30px; height: 46px; padding: 0 8px; border-radius: 6px; border: 0; background: #374151; color: #e5e7eb;
    font: inherit; font-weight: 700; text-transform: uppercase; cursor: pointer; }
  .key.correct { background: #22c55e; color: #05140a; } .key.present { background: #eab308; color: #1a1400; } .key.absent { background: #111827; color: #4b5563; }
  .key.wide { min-width: 56px; font-size: 12px; }
  footer { color: #4b5563; font-size: 12px; }
</style>
</head>
<body>
  <h1>🟩 wordle-br</h1>
  <div id="board"></div>
  <div id="msg"></div>
  <div id="kb"></div>
  <footer>palavra do dia · 6 tentativas · acentos são ignorados</footer>
  <script type="module" src="./game.js"></script>
</body>
</html>
